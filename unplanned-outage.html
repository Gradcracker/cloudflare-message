<!DOCTYPE html>
<html>
    <head>
        <title>Gradcracker - We'll be right back</title>

        <meta name="viewport" content="width=device-width, initial-scale=1">

        <link href="https://fonts.googleapis.com/css?family=Open+Sans:300,400,600,700,800" rel="stylesheet">

        <style>
            html, body {
                height: 100%;
                margin: 0;
                padding: 0;
                background: #1a202c;
                font-family: 'Open Sans', sans-serif;
            }

            body {
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .content {
                text-align: center;
                max-width: 560px;
                padding: 0 20px;
            }

            .content img {
                width: 100%;
                max-width: 260px;
                height: auto;
                margin-bottom: clamp(28px, 5vw, 40px);
            }

            .content h1 {
                color: #f97316;
                font-size: clamp(24px, 5.5vw, 40px);
                font-weight: 300;
                white-space: nowrap;
                margin: 0 0 24px;
            }

            .content p {
                color: #fff;
                font-size: 15px;
                font-weight: 400;
                line-height: 1.65;
                margin: 0 auto 12px;
                max-width: 32em;
            }


            .status {
                margin-top: clamp(36px, 7vw, 56px);
                color: #64748b;
                font-size: 13px;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 8px;
            }

            .status-dot {
                width: 8px;
                height: 8px;
                border-radius: 50%;
                background: #f97316;
                animation: pulse 2s ease-in-out infinite;
            }

            @keyframes pulse {
                0%, 100% { opacity: 1; }
                50% { opacity: 0.3; }
            }

            .timestamp {
                margin: 0 0 16px;
                color: #94a3b8;
                font-size: 13px;
            }
        </style>
    </head>
    <body>
        <div class="content">
            <img src="https://djrbepx1gcy8b.cloudfront.net/brand/gradcracker-white-orange-reg.svg" alt="Gradcracker - Where the STEM jobs are">
            <h1>We'll be right back</h1>
            <p>Gradcracker is temporarily unavailable.<br>Please check back in a few minutes.</p>
            <div class="status">
                <div class="status-dot"></div>
                This page will refresh automatically when we're back.
            </div>

            <div style="display: none;">::CLOUDFLARE_ERROR_500S_BOX::</div>
        </div>

        <script>
            (function () {
                function poll() {
                    fetch(location.href, { method: 'HEAD', cache: 'no-store' })
                        .then(function (response) {
                            if (response.ok) {
                                location.reload();
                            }
                        })
                        .catch(function () {})
                        .finally(function () {
                            setTimeout(poll, 26000 + Math.random() * 4000);
                        });
                }
                setTimeout(poll, 26000 + Math.random() * 4000);
            })();
        </script>
    </body>
</html>
